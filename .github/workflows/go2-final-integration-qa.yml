name: MeongGO 2.0 final integration QA (isolated only)
on:
  push:
    branches:
      - fix/go2-content-gating-20261119
      - work/meonggo2-adoption-album-hidden-20261119
      - work/meonggo2-admin-nav-stats-phase1-20261119
      - work/meonggo2-hidden-cinematic-phase2-20261119
      - work/meonggo2-quest-typography-phase3-20261119
      - work/meonggo2-pixel-poses-hidden-visit-20261119
      - work/meonggo2-friend-pvp-card-ready-reveal-20261119
      - work/meonggo2-release-hidden-random-care-pvp-20261119
      - work/meonggo2-ux-stats-20261120
      - work/meonggo-stats-exclude-test-accounts-20261121
      - work/meonggo-admin-grant-exclusion-20261125
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local
          POSTGRES_DB: go_integration_gha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d go_integration_gha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QA_DB_HOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: qa-only-local
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3010
      NEXT_PUBLIC_SUPABASE_ANON_KEY: qa-not-a-real-key
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install local PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Install locked dependencies
        run: npm ci
      - name: Run all Node unit tests
        run: node --test tests/*.test.mjs
      - name: Apply 2-5 + all predeploy drafts twice to synthetic database
        run: bash scripts/verify-go-integration-local.sh go_integration_gha
      - name: Build all MeongGO feature flags ON
        env:
          NEXT_PUBLIC_MEONGGO_STAGE1_COINS_ENABLED: '1'
          MEONGGO_STAGE1_COINS_ENABLED: '1'
          NEXT_PUBLIC_MEONGGO_STAGE2_OFFICIAL_ENABLED: '1'
          MEONGGO_STAGE2_OFFICIAL_ENABLED: '1'
          NEXT_PUBLIC_MEONGGO_STAGE4_STORE_ENABLED: '1'
          MEONGGO_STAGE4_STORE_ENABLED: '1'
          NEXT_PUBLIC_MEONGGO_STAGE5_PVP_ENABLED: '1'
          MEONGGO_STAGE5_PVP_ENABLED: '1'
        run: npm run build
      - name: Smoke check Next.js routes with MeongGO flags ON
        run: bash scripts/verify-go-http-smoke.sh
      - name: Build all MeongGO feature flags OFF
        run: npm run build
      - name: Smoke check Next.js routes with MeongGO flags OFF
        run: bash scripts/verify-go-http-smoke.sh

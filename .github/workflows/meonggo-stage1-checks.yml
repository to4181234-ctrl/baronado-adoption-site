# Isolated stage-one checks; NEVER applies migration to production.
name: MeongGO stage 1 checks
on:
  push:
    branches:
      - feat/meonggo-stage1-coins-20261114
  pull_request:

permissions:
  contents: read

jobs:
  stage1-tests:
    # Pin Ubuntu 24.04: Playwright 1.56 lacks Ubuntu 26.04 Chromium support.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stage1_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stage1_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Validate new stage-one input rules and server syntax
        run: |
          node --test tests/go-coins.test.mjs tests/go-visit.test.mjs tests/go-coin-notices.test.mjs
          node --check lib/goCoins.js
          node --check lib/goVisit.js
          node --check app/api/go/coins/route.js
          node --check app/api/go/interaction/route.js
          node --check app/api/go/visit/route.js
          node --check app/api/admin/go/visit/route.js
      - name: Verify migration proposals against ephemeral PostgreSQL 17
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: stage1_ci
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/go-stage1-postgres.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031_meonggo_pixel_affinity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/proposals/meonggo_stage1_coins_REVIEW_NOT_APPLIED.sql
          psql -v ON_ERROR_STOP=1 -f supabase/proposals/meonggo_stage1_visit_REVIEW_NOT_APPLIED.sql
          psql -v ON_ERROR_STOP=1 -f tests/go-stage1-postgres.sql
          bash tests/go-stage1-concurrency.sh
      - name: Install locked dependencies
        run: npm ci
      - name: Next.js production build with stage-one UI enabled
        env:
          NEXT_PUBLIC_MEONGGO_STAGE1_COINS_ENABLED: '1'
        run: npm run build
      - name: Install pinned Playwright in ephemeral runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.0
          npx playwright install --with-deps chromium
      - name: Test mobile stage-one screens using isolated mocked APIs
        env:
          NEXT_PUBLIC_MEONGGO_STAGE1_COINS_ENABLED: '1'
        run: npx playwright test --config=tests/playwright.config.mjs


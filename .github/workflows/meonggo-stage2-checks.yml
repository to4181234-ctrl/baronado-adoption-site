name: MeongGO stage 2 (review-only)
on:
  push:
    branches: [feat/meonggo-stage2-official-cards-20261114]
  pull_request:
permissions:
  contents: read
jobs:
  official-cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meonggo2_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d meonggo2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Re-run stage-one and stage-two SQL on disposable Postgres
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: meonggo2_ci
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/go-stage1-postgres.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031_meonggo_pixel_affinity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/proposals/meonggo_stage1_coins_REVIEW_NOT_APPLIED.sql
          psql -v ON_ERROR_STOP=1 -f supabase/proposals/meonggo_stage1_visit_REVIEW_NOT_APPLIED.sql
          psql -v ON_ERROR_STOP=1 -f tests/go-stage1-postgres.sql
          bash tests/go-stage1-concurrency.sh
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/go-stage2-postgres.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031_meonggo_battle.sql
          psql -v ON_ERROR_STOP=1 -f supabase/proposals/meonggo_stage2_official_REVIEW_NOT_APPLIED.sql
          psql -v ON_ERROR_STOP=1 -f tests/go-stage2-postgres.sql
      - name: Install dependencies
        run: npm ci
      - name: Validate stage-one and stage-two rules, image crop and JavaScript syntax
        run: |
          node --test tests/go-coins.test.mjs tests/go-visit.test.mjs tests/go-coin-notices.test.mjs tests/go-official-images.test.mjs
          node --check app/api/go/official/route.js
          node --check app/api/go/official/shop/route.js
          node --check app/api/go/official/hidden/route.js
          node --check app/api/admin/go/official/route.js
          node --check app/api/go/official/camera/route.js
          node --check app/api/go/cards/route.js
      - name: Next production build with first two stages enabled
        env:
          NEXT_PUBLIC_MEONGGO_STAGE1_COINS_ENABLED: '1'
          NEXT_PUBLIC_MEONGGO_STAGE2_OFFICIAL_ENABLED: '1'
        run: npm run build
      - name: Install Chromium for stage-two UI test
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.0
          npx playwright install --with-deps chromium
      - name: Test stage-two mobile official album, shop and admin screens
        env:
          NEXT_PUBLIC_MEONGGO_STAGE1_COINS_ENABLED: '1'
          NEXT_PUBLIC_MEONGGO_STAGE2_OFFICIAL_ENABLED: '1'
        run: npx playwright test --config=tests/playwright-stage2.config.mjs
